name: WG-038 bootstrap validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'wg-038-typescript-react-vite-tailwind-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out WG-038
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize package lock
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "WG-038: synchronize package lock"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Build authoritative generated site
        run: npm run build

      - name: Run full repository checks
        run: npm run check

      - name: Confirm validation leaves tracked files unchanged
        run: git diff --exit-code
